<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE (ICB) Department Integrated Academic and Information Portal | KSIT Bengaluru</title>
  <meta name="description" content="Centralized academic management portal for the Department of Computer Science & Engineering – ICB at K. S. Institute of Technology (KSIT), Bengaluru.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3.0">
</head>
<body>
  <!-- THREE-ROLE MODERN LOGIN PAGE -->
  <div id="loginViewContainer" class="login-view-container" style="display: none;"></div>

  <!-- AUTHENTICATED APP CONTAINER -->
  <div class="app-container" id="appContainer">
    <!-- LEFT NAVY SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="college-crest">
          <img src="/assets/logo.png" alt="KSIT Logo" onerror="this.src='/assets/ksit_logo.jpg'">
        </div>
        <div class="college-meta">
          <h2>KSIT</h2>
          <p>K. S. Institute of Technology<br>Bengaluru</p>
        </div>
      </div>

      <div class="dept-tag-banner">
        <div class="dept-name">
          <span>CSE (ICB)</span>
        </div>
        <div class="portal-desc">
          ✦ Department Integrated<br>Academic and Information Portal
        </div>
      </div>

      <!-- Navigation Links Container -->
      <nav class="sidebar-nav" id="sidebarNavContainer"></nav>

      <!-- Bottom Motivational Card -->
      <div class="sidebar-bottom-card" id="sidebarBottomCard">
        <h4>Better Everyday</h4>
        <p>Small steps lead to big dreams.</p>
      </div>

      <div class="sidebar-footer-text">
        KSIT • CSE (ICB) Portal &nbsp;|&nbsp; v1.0.0
      </div>
    </aside>

    <!-- RIGHT MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP STICKY HEADER -->
      <header class="top-header">
        <!-- Mobile Sidebar Toggle -->
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" aria-label="Toggle Navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <!-- Search Input -->
        <div class="header-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search for classes, notes, events, notices...">
        </div>

        <!-- Authenticated Active Role Badge -->
        <div class="active-session-pill" id="activeSessionPill">
          <span id="sessionRoleIcon">🎓</span>
          <span id="sessionRoleText">Student Portal</span>
        </div>

        <!-- Header Actions: Database Badge, Notifications, User Menu, Logout -->
        <div class="header-actions">
          <div class="db-status-badge" id="dbStatusBadge" title="Click to view database connection details">
            <span class="db-pulse-dot"></span>
            <span>Database: Loading...</span>
          </div>

          <div class="notif-bell-btn" id="notifBellBtn" title="View Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="notif-badge">3</span>
          </div>

          <div class="user-profile-menu" id="userProfileMenu">
            <!-- Dynamic profile populated by app.js -->
          </div>

          <!-- Sign Out Action -->
          <button class="btn-portal-logout" id="portalLogoutBtn" onclick="handleLogout()" title="Sign Out of Portal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="15" height="15" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Sign Out</span>
          </button>
        </div>
      </header>

      <!-- PAGE CONTENT AREA -->
      <section class="page-container" id="mainContentArea">
        <!-- Injected dynamically by app.js -->
      </section>
    </main>
  </div>

  <!-- MOBILE SIDEBAR BACKDROP -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

  <!-- REUSABLE MODAL BACKDROP & DIALOG -->
  <div class="modal-backdrop" id="genericModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="genericModalTitle">Modal Title</h3>
        <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="genericModalBody">
        <!-- Content injected dynamically -->
      </div>
    </div>
  </div>

  <!-- FLOATING TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- APPLICATION JAVASCRIPT -->
  <script src="/js/app.js?v=3.0"></script>
</body>
</html>
